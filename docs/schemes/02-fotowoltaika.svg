<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Century Gothic, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Panele fotowoltaiczne</text>

  <!-- Isometric row houses -->
  <g transform="translate(60,70)">
    <!-- House 1 -->
    <polygon points="0,80 60,50 120,80 120,140 0,140" fill="#efefef" stroke="#222" stroke-width="1.5"/>
    <polygon points="0,80 60,50 120,80 60,110" fill="#e0e0e0" stroke="#222" stroke-width="1.2"/>
  </g>
  <g transform="translate(180,70)">
    <polygon points="0,80 60,50 120,80 120,140 0,140" fill="#efefef" stroke="#222" stroke-width="1.5"/>
    <polygon points="0,80 60,50 120,80 60,110" fill="#e0e0e0" stroke="#222" stroke-width="1.2"/>
    <!-- PV on south slope -->
    <polygon points="0,80 60,50 120,80 60,110" fill="#4a6fa5" stroke="#222" stroke-width="1.2" opacity="0.85"/>
    <line x1="15" y1="72" x2="105" y2="72" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="30" y1="65" x2="90" y2="65" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="45" y1="58" x2="75" y2="58" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="60" y1="50" x2="60" y2="110" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="30" y1="65" x2="30" y2="95" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="90" y1="65" x2="90" y2="95" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g transform="translate(300,70)">
    <polygon points="0,80 60,50 120,80 120,140 0,140" fill="#efefef" stroke="#222" stroke-width="1.5"/>
    <polygon points="0,80 60,50 120,80 60,110" fill="#4a6fa5" stroke="#222" stroke-width="1.2" opacity="0.85"/>
    <line x1="60" y1="50" x2="60" y2="110" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="30" y1="65" x2="90" y2="65" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Ground -->
  <line x1="40" y1="250" x2="480" y2="250" stroke="#222" stroke-width="1.5"/>
  <rect x="40" y="250" width="440" height="20" fill="#f3f3f3"/>

  <!-- Arrow flow diagram -->
  <g transform="translate(80,275)">
    <rect x="0" y="0" width="70" height="40" fill="#4a6fa5" stroke="#222" stroke-width="1" rx="2"/>
    <text x="35" y="18" text-anchor="middle" font-size="8" fill="#fff">PV</text>
    <text x="35" y="30" text-anchor="middle" font-size="7" fill="#dceefb">DC</text>
    <line x1="70" y1="20" x2="100" y2="20" stroke="#222" stroke-width="1" marker-end="url(#ar)"/>
    <rect x="100" y="5" width="65" height="30" fill="#efefef" stroke="#222" stroke-width="1" rx="2"/>
    <text x="132" y="24" text-anchor="middle" font-size="8" fill="#444">falownik</text>
    <line x1="165" y1="20" x2="195" y2="20" stroke="#222" stroke-width="1" marker-end="url(#ar)"/>
    <rect x="195" y="5" width="65" height="30" fill="#efefef" stroke="#222" stroke-width="1" rx="2"/>
    <text x="227" y="24" text-anchor="middle" font-size="8" fill="#444">dom</text>
    <line x1="260" y1="20" x2="290" y2="20" stroke="#222" stroke-width="1" marker-end="url(#ar)"/>
    <rect x="290" y="5" width="80" height="30" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="2"/>
    <text x="330" y="24" text-anchor="middle" font-size="8" fill="#444">siec</text>
  </g>
  <defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#222"/></marker></defs>

  <!-- Labels on roof -->
  <text x="240" y="155" text-anchor="middle" font-size="9" fill="#4a6fa5" font-weight="600">poludnie</text>
  <text x="120" y="155" text-anchor="middle" font-size="9" fill="#999">polnoc</text>

  <!-- Specs box -->
  <rect x="340" y="80" width="130" height="90" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="405" y="100" text-anchor="middle" font-size="9" fill="#444" font-weight="600">parametry</text>
  <text x="350" y="118" font-size="8" fill="#666">4-6 kWp / dom</text>
  <text x="350" y="132" font-size="8" fill="#666">nachylenie 38 stopni</text>
  <text x="350" y="146" font-size="8" fill="#666">12-16 modulow</text>
  <text x="350" y="160" font-size="8" fill="#666">4000-5000 kWh/rok</text>

  <!-- Description -->
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#444">Panele montowane na polaci poludniowej dachu kazdego budynku.</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#444">Energia zasila ogrzewanie i urzadzenia domowe. Nadwyzka trafia do sieci.</text>
  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#444">Redukcja rachunkow za energie o 40-60%.</text>
</svg>
