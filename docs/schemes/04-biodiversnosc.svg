<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="brick" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#e8daef"/>
      <line x1="0" y1="4" x2="12" y2="4" stroke="#d2b4de" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="900" height="620" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">Schemat bioroznorodnosci - budki legowe i drzewa lisciaste</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">Fragment elewacji poludniowej i ogrodu prywatnego</text>
  <rect x="60" y="75" width="500" height="280" fill="#d6eaf8"/>
  <rect x="60" y="355" width="500" height="120" fill="#abebc6"/>
  <rect x="60" y="355" width="500" height="15" fill="#c8b89a"/>
  <rect x="120" y="150" width="380" height="205" fill="url(#brick)" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="120,150 310,90 500,150" fill="#fadbd8" stroke="#2c3e50" stroke-width="2"/>
  <rect x="160" y="200" width="90" height="120" fill="#85c1e9" stroke="#2980b9" stroke-width="2"/>
  <rect x="280" y="200" width="90" height="120" fill="#85c1e9" stroke="#2980b9" stroke-width="2"/>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#1a5276">elewacja poludniowa</text>
  <ellipse cx="90" cy="310" rx="45" ry="55" fill="#27ae60" opacity="0.9"/>
  <rect x="84" y="330" width="12" height="40" fill="#6e4c2a"/>
  <text x="90" y="395" text-anchor="middle" font-size="11" fill="#1e8449" font-weight="bold">klon / lipa</text>
  <rect x="175" y="175" width="22" height="28" fill="#a0522d" stroke="#6e3c14" stroke-width="1" rx="2"/>
  <circle cx="186" cy="192" r="5" fill="#2c3e50"/>
  <text x="186" y="218" text-anchor="middle" font-size="8" fill="#fff">1</text>
  <rect x="355" y="175" width="22" height="28" fill="#a0522d" stroke="#6e3c14" stroke-width="1" rx="2"/>
  <circle cx="366" cy="192" r="5" fill="#2c3e50"/>
  <text x="366" y="218" text-anchor="middle" font-size="8" fill="#fff">2</text>
  <rect x="68" y="250" width="18" height="22" fill="#a0522d" stroke="#6e3c14" stroke-width="1" rx="2"/>
  <text x="77" y="285" text-anchor="middle" font-size="7" fill="#6e3c14">3</text>
  <rect x="590" y="90" width="270" height="130" fill="#fff" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="725" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">Drzewa lisciaste</text>
  <text x="605" y="140" font-size="11" fill="#333">- sadzone 3-4 m od elewacji poludniowej</text>
  <text x="605" y="160" font-size="11" fill="#333">- gatunki: klon, lipa, brzoza</text>
  <text x="605" y="180" font-size="11" fill="#333">- lato: cien, mniejsze przegrzewanie</text>
  <text x="605" y="200" font-size="11" fill="#333">- zima: brak lisci, naslonecznienie wnetrz</text>
  <rect x="590" y="240" width="270" height="140" fill="#fff" stroke="#a0522d" stroke-width="2" rx="8"/>
  <text x="725" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e3c14">Budki legowe</text>
  <text x="605" y="290" font-size="11" fill="#333">- min. 2 budki na kazdy budynek</text>
  <text x="605" y="310" font-size="11" fill="#333">- montaz: 3-5 m wysokosci, elewacja E/S</text>
  <text x="605" y="330" font-size="11" fill="#333">- otwor 32 mm (sikorki), 45 mm (dzierzby)</text>
  <text x="605" y="350" font-size="11" fill="#333">- drewno lisciaste, bez impregnacji</text>
  <text x="605" y="370" font-size="11" fill="#333">- dodatkowe budki na drzewach we wspolnych wnetrzach</text>
  <rect x="60" y="490" width="780" height="115" fill="#fff" stroke="#bdc3c7" rx="6"/>
  <text x="80" y="515" font-size="12" font-weight="bold" fill="#333">LATO: geste liscie daja cien na elewacji | ZIMA: brak lisci - pasywne ogrzewanie sloneczne</text>
  <text x="80" y="540" font-size="11" fill="#333">Budki legowe wspieraja sikorki, mucholowki, dzierzby - naturalna kontrola owadow</text>
  <text x="80" y="565" font-size="11" fill="#333">1, 2 - elewacja poludniowa/wschodnia | 3 - na drzewie we wspolnym wnetrzu zielonym</text>
</svg>
