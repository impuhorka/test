<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Century Gothic, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Budki legowe i drzewa lisciaste</text>

  <!-- Elevation south facade -->
  <rect x="80" y="55" width="360" height="30" fill="#fafafa"/>
  <rect x="80" y="230" width="360" height="25" fill="#f3f3f3"/>
  <line x1="80" y1="255" x2="440" y2="255" stroke="#222" stroke-width="1.5"/>

  <!-- House -->
  <polygon points="120,255 120,100 260,60 400,100 400,255" fill="#efefef" stroke="#222" stroke-width="1.5"/>
  <rect x="160" y="140" width="70" height="115" fill="#dceefb" stroke="#222" stroke-width="1.2"/>
  <rect x="270" y="140" width="70" height="115" fill="#dceefb" stroke="#222" stroke-width="1.2"/>
  <text x="260" y="240" text-anchor="middle" font-size="9" fill="#666">elewacja poludniowa</text>

  <!-- Bird boxes on facade -->
  <rect x="175" y="115" width="16" height="20" fill="#efefef" stroke="#222" stroke-width="1.2" rx="1"/>
  <circle cx="183" cy="127" r="3.5" fill="#222"/>
  <text x="183" y="112" text-anchor="middle" font-size="7" fill="#666">1</text>
  <rect x="340" y="115" width="16" height="20" fill="#efefef" stroke="#222" stroke-width="1.2" rx="1"/>
  <circle cx="348" cy="127" r="3.5" fill="#222"/>
  <text x="348" y="112" text-anchor="middle" font-size="7" fill="#666">2</text>

  <!-- Deciduous tree left -->
  <circle cx="95" cy="210" r="28" fill="#d4edda" stroke="#222" stroke-width="1.2"/>
  <circle cx="78" cy="198" r="16" fill="#c3e6cb" stroke="#222" stroke-width="1"/>
  <circle cx="112" cy="200" r="14" fill="#c3e6cb" stroke="#222" stroke-width="1"/>
  <rect x="90" y="228" width="10" height="27" fill="#efefef" stroke="#222" stroke-width="1"/>
  <text x="95" y="275" text-anchor="middle" font-size="8" fill="#555">klon / lipa</text>

  <!-- Bird box on tree -->
  <rect x="88" y="195" width="12" height="14" fill="#efefef" stroke="#222" stroke-width="1" rx="1"/>
  <circle cx="94" cy="203" r="2.5" fill="#222"/>
  <text x="105" y="200" font-size="7" fill="#666">3</text>

  <!-- Summer shade dashed -->
  <path d="M 95 182 Q 180 130 260 140" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="175" y="125" font-size="8" fill="#888">cien latem</text>

  <!-- Winter sun -->
  <circle cx="55" cy="130" r="10" fill="#f5e6a3" stroke="#222" stroke-width="1"/>
  <line x1="65" y1="135" x2="160" y2="170" stroke="#e8c840" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="50" y="118" font-size="7" fill="#888">zima</text>

  <!-- Season diagram -->
  <rect x="80" y="290" width="180" height="55" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="170" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#444">LATO</text>
  <text x="170" y="322" text-anchor="middle" font-size="8" fill="#666">geste liscie - cien na oknach</text>
  <text x="170" y="335" text-anchor="middle" font-size="8" fill="#666">mniejsze przegrzewanie wnetrz</text>

  <rect x="280" y="290" width="180" height="55" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#444">ZIMA</text>
  <text x="370" y="322" text-anchor="middle" font-size="8" fill="#666">brak lisci - naslonecznienie</text>
  <text x="370" y="335" text-anchor="middle" font-size="8" fill="#666">pasywne ogrzewanie sloneczne</text>

  <!-- Description -->
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#444">Drzewa lisciaste sadzone 3-4 m od elewacji poludniowej.</text>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#444">Budki legowe (min. 2 na dom) na elewacjach i drzewach we wspolnych wnetrzach.</text>
  <text x="260" y="402" text-anchor="middle" font-size="10" fill="#444">Wspieraja sikorki i mucholowki - naturalna kontrola owadow.</text>
</svg>
