<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Century Gothic, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Rozwiazania spoleczne</text>

  <!-- Isometric plan view of cluster -->
  <g transform="translate(70,55)">
    <!-- Outer buildings frame -->
    <polygon points="20,60 180,60 180,200 20,200" fill="none" stroke="#222" stroke-width="1.5"/>
    <!-- Top row houses -->
    <polygon points="30,60 90,30 150,60 150,90 30,90" fill="#efefef" stroke="#222" stroke-width="1.2"/>
    <polygon points="150,60 210,30 270,60 270,90 150,90" fill="#efefef" stroke="#222" stroke-width="1.2"/>
    <!-- Bottom row -->
    <polygon points="30,170 90,200 150,170 150,140 30,140" fill="#efefef" stroke="#222" stroke-width="1.2"/>
    <polygon points="150,170 210,200 270,170 270,140 150,140" fill="#efefef" stroke="#222" stroke-width="1.2"/>
    <!-- Side -->
    <polygon points="20,60 30,90 30,140 20,170" fill="#e0e0e0" stroke="#222" stroke-width="1.2"/>
    <polygon points="270,60 280,90 280,140 270,170" fill="#e0e0e0" stroke="#222" stroke-width="1.2"/>

    <!-- Central green courtyard -->
    <rect x="55" y="95" width="170" height="75" fill="#d4edda" stroke="#222" stroke-width="1.5" rx="4"/>
    <text x="140" y="125" text-anchor="middle" font-size="9" fill="#3d7a50" font-weight="600">wspolne wnetrze</text>
    <text x="140" y="140" text-anchor="middle" font-size="8" fill="#3d7a50">zielone</text>

    <!-- Benches -->
    <rect x="75" y="150" width="20" height="6" fill="#efefef" stroke="#222" stroke-width="1" rx="1"/>
    <rect x="185" y="150" width="20" height="6" fill="#efefef" stroke="#222" stroke-width="1" rx="1"/>

    <!-- People silhouettes -->
    <circle cx="110" cy="118" r="4" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <ellipse cx="110" cy="130" rx="4" ry="8" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <circle cx="165" cy="120" r="4" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <ellipse cx="165" cy="132" rx="4" ry="8" fill="#ccc" stroke="#222" stroke-width="0.8"/>
  </g>

  <!-- Community garden detail -->
  <g transform="translate(310,55)">
    <rect x="0" y="0" width="160" height="110" fill="#fafafa" stroke="#222" stroke-width="1.2"/>
    <text x="80" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#222">Ogrodek spoleczny</text>
    <rect x="10" y="28" width="35" height="30" fill="#d4edda" stroke="#222" stroke-width="0.8"/>
    <rect x="50" y="28" width="35" height="30" fill="#d4edda" stroke="#222" stroke-width="0.8"/>
    <rect x="90" y="28" width="35" height="30" fill="#d4edda" stroke="#222" stroke-width="0.8"/>
    <rect x="10" y="63" width="35" height="30" fill="#d4edda" stroke="#222" stroke-width="0.8"/>
    <rect x="50" y="63" width="35" height="30" fill="#d4edda" stroke="#222" stroke-width="0.8"/>
    <rect x="90" y="63" width="55" height="30" fill="#efefef" stroke="#222" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="117" y="82" text-anchor="middle" font-size="7" fill="#888">szklarnia</text>
    <text x="27" y="48" text-anchor="middle" font-size="6" fill="#666">grz.</text>
    <text x="67" y="48" text-anchor="middle" font-size="6" fill="#666">grz.</text>
    <text x="107" y="48" text-anchor="middle" font-size="6" fill="#666">grz.</text>
    <rect x="10" y="98" width="60" height="8" fill="#e0e0e0" stroke="#222" stroke-width="0.8"/>
    <text x="40" y="106" text-anchor="middle" font-size="6" fill="#666">kompostownik</text>
  </g>

  <!-- Recreation area elevation -->
  <g transform="translate(60,230)">
    <text x="200" y="0" text-anchor="middle" font-size="11" font-weight="600" fill="#222">Przestrzen rekreacyjna</text>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#222" stroke-width="1.5"/>
    <rect x="0" y="80" width="400" height="15" fill="#f3f3f3"/>

    <!-- Trees -->
    <circle cx="60" cy="65" r="16" fill="#d4edda" stroke="#222" stroke-width="1"/>
    <rect x="56" y="72" width="8" height="18" fill="#efefef" stroke="#222" stroke-width="1"/>
    <circle cx="340" cy="65" r="16" fill="#d4edda" stroke="#222" stroke-width="1"/>
    <rect x="336" y="72" width="8" height="18" fill="#efefef" stroke="#222" stroke-width="1"/>

    <!-- Bench -->
    <rect x="120" y="68" width="35" height="6" fill="#efefef" stroke="#222" stroke-width="1" rx="1"/>
    <line x1="125" y1="74" x2="125" y2="80" stroke="#222" stroke-width="1"/>
    <line x1="150" y1="74" x2="150" y2="80" stroke="#222" stroke-width="1"/>

    <!-- Playground structure -->
    <line x1="220" y1="80" x2="220" y2="50" stroke="#222" stroke-width="1.5"/>
    <line x1="200" y1="55" x2="240" y2="55" stroke="#222" stroke-width="1.5"/>
    <line x1="200" y1="55" x2="210" y2="80" stroke="#222" stroke-width="1"/>
    <line x1="240" y1="55" x2="230" y2="80" stroke="#222" stroke-width="1"/>

    <!-- People -->
    <circle cx="180" cy="58" r="5" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <ellipse cx="180" cy="72" rx="5" ry="10" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <circle cx="280" cy="60" r="4" fill="#ccc" stroke="#222" stroke-width="0.8"/>
    <ellipse cx="280" cy="72" rx="4" ry="8" fill="#ccc" stroke="#222" stroke-width="0.8"/>

    <!-- LED lamp -->
    <line x1="380" y1="80" x2="380" y2="45" stroke="#222" stroke-width="1.5"/>
    <rect x="372" y="40" width="16" height="6" fill="#efefef" stroke="#222" stroke-width="1"/>
    <polygon points="365,46 395,46 380,30" fill="#f5e6a3" opacity="0.5" stroke="none"/>
  </g>

  <!-- Labels -->
  <text x="130" y="225" text-anchor="middle" font-size="8" fill="#666">6 wnetrz zielonych</text>
  <text x="390" y="225" text-anchor="middle" font-size="8" fill="#666">ogrod ~400 m2</text>

  <!-- Description -->
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#444">Szesc wspolnych wnetrz zielonych z lawkami i miejscami spotkan.</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#444">Centralny park z placem zabaw, sciezkami i altana sasiedzka.</text>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#444">Wspolny ogrod spoleczny z grzadkami, szklarnia i kompostownikiem.</text>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#444">Wszystkie przestrzenie dostepne bez barier - projektowanie uniwersalne.</text>
</svg>
