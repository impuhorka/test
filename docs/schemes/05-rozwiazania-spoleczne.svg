<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="garden" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#d5f5e3"/>
      <rect x="1" y="1" width="5" height="5" fill="#82e0aa" opacity="0.5"/>
    </pattern>
    <pattern id="park" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#abebc6"/>
    </pattern>
  </defs>
  <rect width="900" height="680" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">Schemat rozwiazan spolecznych</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">Wspolny ogrod spoleczny i przestrzenie rekreacyjne | rzut osiedla</text>
  <g transform="translate(100,75)">
    <circle cx="300" cy="250" r="85" fill="url(#park)" stroke="#27ae60" stroke-width="3"/>
    <text x="300" y="245" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">PARK</text>
    <text x="300" y="265" text-anchor="middle" font-size="11" fill="#1e8449">CENTRALNY</text>
    <rect x="230" y="30" width="140" height="70" fill="url(#garden)" stroke="#1e8449" stroke-width="2" rx="6"/>
    <text x="300" y="58" text-anchor="middle" font-size="11" fill="#145a32" font-weight="bold">WSPOLNY OGRÓD</text>
    <text x="300" y="76" text-anchor="middle" font-size="9" fill="#145a32">grzadki, szklarnia, kompostownik</text>
    <rect x="50" y="50" width="80" height="60" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="90" y="85" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 1</text>
    <rect x="470" y="50" width="80" height="60" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="510" y="85" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 2</text>
    <rect x="25" y="195" width="70" height="70" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="60" y="235" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 3</text>
    <rect x="505" y="195" width="70" height="70" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="540" y="235" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 4</text>
    <rect x="50" y="390" width="80" height="60" fill="#abebc6" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="90" y="425" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 5</text>
    <rect x="470" y="390" width="80" height="60" fill="#abebc6" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="510" y="425" text-anchor="middle" font-size="8" fill="#1e8449">wnetrze 6</text>
    <line x1="300" y1="100" x2="300" y2="165" stroke="#7d6608" stroke-width="3" stroke-dasharray="6,3"/>
    <line x1="150" y1="250" x2="215" y2="250" stroke="#7d6608" stroke-width="3" stroke-dasharray="6,3"/>
  </g>
  <rect x="60" y="500" width="380" height="160" fill="#fff" stroke="#1e8449" stroke-width="2" rx="8"/>
  <text x="250" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Wspolny ogrod spoleczny</text>
  <text x="80" y="555" font-size="11" fill="#333">Powierzchnia ok. 400 m2 | grzadki dzierzawione przez mieszkancow</text>
  <text x="80" y="575" font-size="11" fill="#333">Szklarnia, kompostownik, miejsce integracji miedzypokoleniowej</text>
  <text x="80" y="595" font-size="11" fill="#333">Edukacja ekologiczna dzieci, wspolna uprawa warzyw</text>
  <rect x="460" y="500" width="380" height="160" fill="#fff" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="650" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">Przestrzen rekreacyjna</text>
  <text x="480" y="550" font-size="11" fill="#333">- Lawki w kazdym wnetrzu zielonym (min. 4)</text>
  <text x="480" y="572" font-size="11" fill="#333">- Plac zabaw w parku centralnym</text>
  <text x="480" y="594" font-size="11" fill="#333">- Sciezki spacerowe wokol parku (ok. 400 m)</text>
  <text x="480" y="616" font-size="11" fill="#333">- Strefa grillowania i altana sasiedzka</text>
  <text x="480" y="638" font-size="11" fill="#333">- Wszystkie przestrzenie bez barier (Dostepnosc)</text>
</svg>
