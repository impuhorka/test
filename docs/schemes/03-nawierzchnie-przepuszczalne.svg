<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="permeable" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#d4e6c3"/>
      <circle cx="2" cy="2" r="1.2" fill="#a9c882"/>
      <circle cx="7" cy="6" r="1" fill="#a9c882"/>
      <circle cx="4" cy="8" r="0.8" fill="#a9c882"/>
    </pattern>
    <pattern id="semiperm" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e8dcc8"/>
      <rect x="0" y="0" width="4" height="4" fill="#d5c4a1"/>
      <rect x="4" y="4" width="4" height="4" fill="#d5c4a1"/>
    </pattern>
    <pattern id="imperm" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#7f8c8d"/>
    </pattern>
    <pattern id="rain" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#a9cce3"/>
      <ellipse cx="6" cy="6" rx="4" ry="3" fill="#5dade2" opacity="0.6"/>
    </pattern>
    <pattern id="lawn" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#abebc6"/>
    </pattern>
  </defs>

  <rect width="900" height="650" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">Schemat nawierzchni przepuszczalnych i retencji wód opadowych</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">Rzut fragmentu osiedla (1 skupisko + cig komunikacyjny)</text>

  <!-- Site layout -->
  <g transform="translate(80,80)">
    <!-- Central green courtyard -->
    <rect x="180" y="120" width="280" height="200" fill="url(#lawn)" stroke="#27ae60" stroke-width="2" rx="12"/>
    <text x="320" y="210" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">wntrze zielone</text>
    <text x="320" y="230" text-anchor="middle" font-size="11" fill="#1e8449">trawnik  100% przepuszczalny</text>

    <!-- Houses around courtyard (schematic) -->
    <rect x="60" y="60" width="520" height="40" fill="#fadbd8" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="60" y="340" width="520" height="40" fill="#d5f5e3" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="60" y="100" width="40" height="240" fill="#fdebd0" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="540" y="100" width="40" height="240" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="320" y="85" text-anchor="middle" font-size="10" fill="#555">zabudowa szeregowa</text>

    <!-- Permeable paths -->
    <rect x="180" y="60" width="280" height="25" fill="url(#permeable)" stroke="#7d6608" stroke-width="1"/>
    <text x="320" y="77" text-anchor="middle" font-size="9" fill="#333">[cie|ka piesza  kruszywo przepuszczalne</text>
    <rect x="180" y="355" width="280" height="25" fill="url(#permeable)" stroke="#7d6608" stroke-width="1"/>

    <!-- Semi-permeable parking -->
    <rect x="60" y="400" width="200" height="60" fill="url(#semiperm)" stroke="#8b7355" stroke-width="1.5"/>
    <text x="160" y="435" text-anchor="middle" font-size="10" fill="#333">parking  kostka a|urowa</text>

    <!-- Impermeable road -->
    <rect x="300" y="400" width="280" height="60" fill="url(#imperm)" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="440" y="435" text-anchor="middle" font-size="10" fill="#fff">droga wewntrzna  kostka betonowa</text>

    <!-- Rain garden -->
    <ellipse cx="130" cy="200" rx="55" ry="40" fill="url(#rain)" stroke="#2980b9" stroke-width="2"/>
    <text x="130" y="195" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">ogród</text>
    <text x="130" y="210" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">deszczowy</text>

    <!-- Infiltration well -->
    <circle cx="500" cy="430" r="25" fill="#5dade2" stroke="#1a5276" stroke-width="2"/>
    <text x="500" y="435" text-anchor="middle" font-size="9" fill="#fff">studnia</text>
    <text x="500" y="447" text-anchor="middle" font-size="9" fill="#fff">infiltr.</text>

    <!-- Water flow arrows -->
    <path d="M 300 400 Q 250 380 180 340" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#warr)"/>
    <path d="M 440 400 Q 480 390 500 405" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#warr)"/>
    <text x="250" y="370" font-size="10" fill="#3498db">spByw wód opadowych</text>
  </g>
  <defs><marker id="warr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3498db"/></marker></defs>

  <!-- Rain drops -->
  <text x="100" y="115" font-size="18" fill="#3498db">=§</text>
  <text x="550" y="115" font-size="18" fill="#3498db">=§</text>

  <!-- Legend -->
  <rect x="60" y="520" width="780" height="115" fill="#fff" stroke="#bdc3c7" rx="6"/>
  <text x="80" y="542" font-size="13" font-weight="bold" fill="#333">Legenda nawierzchni</text>
  <rect x="80" y="552" width="28" height="18" fill="url(#permeable)" stroke="#7d6608"/>
  <text x="116" y="566" font-size="11" fill="#333">W peBni przepuszczalna  [cie|ki piesze, place ziemne (infiltracja &gt; 90%)</text>
  <rect x="80" y="574" width="28" height="18" fill="url(#semiperm)" stroke="#8b7355"/>
  <text x="116" y="588" font-size="11" fill="#333">Cz[ciowo przepuszczalna  parkingi z kostki a|urowej/trawy (infiltracja 5080%)</text>
  <rect x="80" y="596" width="28" height="18" fill="url(#imperm)" stroke="#2c3e50"/>
  <text x="116" y="610" font-size="11" fill="#333">Nieprzepuszczalna  drogi dojazdowe (odprowadzenie do studni retencyjnych)</text>
  <ellipse cx="94" cy="625" rx="12" ry="8" fill="url(#rain)" stroke="#2980b9"/>
  <text x="116" y="629" font-size="11" fill="#333">Ogrody deszczowe i studnie infiltracji  lokalna retencja, bez odprowadzania do kanalizacji</text>
</svg>
