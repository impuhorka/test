<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="560" fill="#f8f6f1"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">Struktura przestrzenna Wojnicza</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">trzy strefy urbanistyczne + dzielnice</text>

  <!-- Outer suburban -->
  <ellipse cx="410" cy="300" rx="340" ry="220" fill="#e8f0e4" stroke="#7aa66d" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="120" y="130" font-size="12" font-weight="700" fill="#4a7c59">Strefa podmiejska</text>
  <text x="120" y="146" font-size="10" fill="#666">zabudowa jednorodzinna, tereny otwarte</text>

  <!-- Urban zone -->
  <ellipse cx="410" cy="310" rx="230" ry="150" fill="#dce8f4" stroke="#5b8db8" stroke-width="2"/>
  <text x="600" y="200" font-size="12" font-weight="700" fill="#1e3a5f">Strefa miejska</text>
  <text x="600" y="216" font-size="10" fill="#666">ulice historyczne, waBy, dwór</text>

  <!-- Center -->
  <ellipse cx="410" cy="315" rx="110" ry="75" fill="#1e3a5f" stroke="#0f2744" stroke-width="2"/>
  <text x="410" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CENTRUM</text>
  <text x="410" y="326" text-anchor="middle" font-size="10" fill="#dbeafe">Rynek · kolegiata</text>

  <!-- Dunajec -->
  <path d="M520 420 C480 380, 440 360, 380 350 C340 345, 300 360, 260 400" fill="none" stroke="#3498db" stroke-width="6"/>
  <text x="540" y="430" font-size="12" fill="#2980b9" font-weight="600">Dunajec</text>

  <!-- Districts -->
  <circle cx="250" cy="250" r="8" fill="#c45c26"/>
  <text x="250" y="235" text-anchor="middle" font-size="9" fill="#333">Zamo[cie</text>
  <circle cx="560" cy="280" r="8" fill="#c45c26"/>
  <text x="560" y="265" text-anchor="middle" font-size="9" fill="#333">Ratnawy</text>
  <circle cx="300" cy="420" r="8" fill="#c45c26"/>
  <text x="300" y="445" text-anchor="middle" font-size="9" fill="#333">Podlesie</text>
  <circle cx="520" cy="400" r="8" fill="#c45c26"/>
  <text x="520" y="425" text-anchor="middle" font-size="9" fill="#333">Wolice</text>
  <circle cx="180" cy="340" r="8" fill="#c45c26"/>
  <text x="180" y="365" text-anchor="middle" font-size="9" fill="#333">BBonie</text>
  <circle cx="640" cy="340" r="8" fill="#c45c26"/>
  <text x="640" y="365" text-anchor="middle" font-size="9" fill="#333">Kolonia</text>

  <!-- Industrial north -->
  <rect x="320" y="95" width="180" height="45" rx="6" fill="#f5deb3" stroke="#c45c26" stroke-width="2"/>
  <text x="410" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#8b4513">Zielony Park PrzemysBowy</text>
  <text x="410" y="130" text-anchor="middle" font-size="9" fill="#666">DK 94 · strefa TSSE</text>

  <!-- Key landmarks -->
  <rect x="395" y="290" width="30" height="18" fill="#fff" stroke="#333"/>
  <text x="410" y="285" text-anchor="middle" font-size="8" fill="#333">Rynek</text>
  <polygon points="430,275 440,295 420,295" fill="#8b4513"/>
  <text x="455" y="290" font-size="9" fill="#333">Kolegiata</text>
  <circle cx="370" cy="280" r="10" fill="none" stroke="#8b4513" stroke-width="2"/>
  <text x="340" y="275" font-size="9" fill="#333">WaBy</text>

  <!-- Legend -->
  <rect x="60" y="470" width="700" height="70" rx="8" fill="#fff" stroke="#ccc"/>
  <rect x="80" y="490" width="18" height="12" fill="#1e3a5f"/><text x="105" y="501" font-size="10">centrum  usBugi, administracja, kultura</text>
  <rect x="80" y="512" width="18" height="12" fill="#dce8f4" stroke="#5b8db8"/><text x="105" y="523" font-size="10">strefa miejska  zabudowa historyczna</text>
  <rect x="380" y="490" width="18" height="12" fill="#e8f0e4" stroke="#7aa66d"/><text x="405" y="501" font-size="10">strefa podmiejska  domy jednorodzinne</text>
  <rect x="380" y="512" width="18" height="12" fill="#f5deb3" stroke="#c45c26"/><text x="405" y="523" font-size="10">strefa przemysBowa</text>
