  <text x="410" y="272" text-anchor="middle" font-size="9" fill="#333">handel · administracja</text>
  <text x="410" y="286" text-anchor="middle" font-size="9" fill="#333">kultura · rynek</text>

  <!-- Industrial north -->
  <rect x="250" y="130" width="320" height="55" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="410" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#b5651d">PRZEMYSAOWO-USAUGOWA</text>
  <text x="410" y="172" text-anchor="middle" font-size="9" fill="#666">Zielony Park PrzemysBowy · TSSE</text>

  <!-- Cultural/sacral -->
  <circle cx="480" cy="265" r="35" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="480" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="#5b3a6b">KULTURO-</text>
  <text x="480" y="273" text-anchor="middle" font-size="9" font-weight="700" fill="#5b3a6b">SAKRALNA</text>

  <!-- Recreation/green -->
  <ellipse cx="280" cy="340" rx="70" ry="40" fill="#b7e4c7" stroke="#40916c" stroke-width="2"/>
  <text x="280" y="335" text-anchor="middle" font-size="9" font-weight="700" fill="#1b4332">REKREACJA</text>
  <text x="280" y="348" text-anchor="middle" font-size="8" fill="#333">park dworski</text>

  <!-- Agricultural periphery -->
  <rect x="200" y="380" width="420" height="30" fill="#fff2cc" stroke="#d6b656"/>
  <text x="410" y="400" text-anchor="middle" font-size="10" fill="#806000">ROLNICZA / TERENY OTWARTE (gmina)</text>

  <!-- Dunajec recreation -->
  <path d="M550 350 C520 370, 480 390, 430 400" fill="none" stroke="#3498db" stroke-width="5"/>
  <text x="560" y="385" font-size="10" fill="#2980b9">Dunajec</text>

  <!-- Transport corridor -->
  <rect x="620" y="120" width="20" height="280" fill="#f8cecc" stroke="#b85450"/>
  <text x="655" y="260" font-size="10" fill="#b85450" transform="rotate(90 655 260)">korytarz DK 94 / DW 975</text>

  <!-- Legend -->
  <rect x="60" y="430" width="700" height="70" rx="8" fill="#fff" stroke="#ccc"/>
  <rect x="80" y="450" width="14" height="14" fill="#d5e8d4"/><text x="100" y="462" font-size="10">mieszkaniowa (dominujca)</text>
  <rect x="280" y="450" width="14" height="14" fill="#dae8fc"/><text x="300" y="462" font-size="10">usBugowa i administracyjna</text>
  <rect x="500" y="450" width="14" height="14" fill="#ffe6cc"/><text x="520" y="462" font-size="10">przemysBowa</text>
  <rect x="80" y="472" width="14" height="14" fill="#e1d5e7"/><text x="100" y="484" font-size="10">kulturowo-sakralna</text>
  <rect x="280" y="472" width="14" height="14" fill="#b7e4c7"/><text x="300" y="484" font-size="10">rekreacyjna / zieleD</text>
  <rect x="500" y="472" width="14" height="14" fill="#fff2cc"/><text x="520" y="484" font-size="10">rolnicza (peryferie gminy)</text>
</svg>
