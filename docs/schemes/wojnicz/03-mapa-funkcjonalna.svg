<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="520" fill="#f8f6f1"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">Mapa funkcjonalna Wojnicza</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">gBówne funkcje urbanistyczne (schemat)</text>

  <!-- Base city shape -->
  <path d="M200 120 H620 V400 H200 Z" fill="#eee" stroke="#999" stroke-width="1"/>

  <!-- Residential - large areas -->
  <path d="M220 140 H600 V380 H220 Z" fill="#d5e8d4" opacity="0.9"/>
  <text x="410" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#2d6a4f">MIESZKANIOWA</text>

  <!-- Services/admin center -->
