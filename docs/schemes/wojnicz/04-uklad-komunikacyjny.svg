<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="560" fill="#f8f6f1"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">UkBad komunikacyjny Wojnicza</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">drogi, obwodnice, kolej i powizania regionalne</text>

  <!-- City block -->
  <rect x="280" y="180" width="260" height="200" rx="10" fill="#eef3ea" stroke="#7aa66d" stroke-width="2"/>
  <text x="410" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">WOJNICZ</text>
  <text x="410" y="300" text-anchor="middle" font-size="10" fill="#666">centrum historyczne</text>

  <!-- DK 94 through city (old) -->
  <path d="M80 250 H740" stroke="#d35400" stroke-width="8" stroke-linecap="round"/>
  <text x="120" y="240" font-size="11" font-weight="700" fill="#c45c26">DK 94 (E40)</text>

  <!-- Northern bypass -->
  <path d="M120 150 C220 130, 320 120, 410 120 C500 120, 600 130, 700 150" fill="none" stroke="#e67e22" stroke-width="5" stroke-dasharray="10 5"/>
  <text x="410" y="108" text-anchor="middle" font-size="10" fill="#c45c26">Obwodnica póBnocna (2007) · DK 94</text>

  <!-- Eastern bypass DW 975 -->
  <path d="M540 180 C620 140, 680 110, 720 90" fill="none" stroke="#e67e22" stroke-width="5" stroke-dasharray="10 5"/>
  <path d="M540 380 C620 420, 680 450, 720 470" fill="none" stroke="#e67e22" stroke-width="5" stroke-dasharray="10 5"/>
  <text x="680" y="280" font-size="10" fill="#c45c26" transform="rotate(70 680 280)">Obwodnica wschodnia (2014) · DW 975</text>

  <!-- A4 -->
  <rect x="650" y="55" width="120" height="30" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="2"/>
  <text x="710" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#c45c26">A4 · WierzchosBawice</text>

  <!-- Tarnów -->
  <circle cx="120" cy="250" r="22" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a5f">Tarnów</text>

  <!-- Nowy Scz direction -->
  <circle cx="740" cy="250" r="22" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="740" y="245" text-anchor="middle" font-size="9" font-weight="700" fill="#1e3a5f">Nowy</text>
  <text x="740" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#1e3a5f">Scz</text>

  <!-- Railway -->
  <path d="M60 420 C200 400, 350 390, 500 400 C620 410, 720 430, 780 450" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="500" y1="395" x2="500" y2="420" stroke="#555" stroke-width="2"/>
  <rect x="470" y="425" width="60" height="22" rx="4" fill="#ddd" stroke="#555"/>
  <text x="500" y="440" text-anchor="middle" font-size="9" fill="#333">stacja</text>
  <text x="410" y="470" text-anchor="middle" font-size="11" fill="#555">Linia kolejowa 103 (Tarnów  Krynica)</text>

  <!-- Bus -->
  <rect x="300" y="320" width="80" height="24" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="340" y="336" text-anchor="middle" font-size="9" fill="#1e3a5f">PKS / autobusy</text>

  <!-- Distances -->
  <text x="200" y="270" font-size="9" fill="#666">15 km</text>
  <text x="620" y="85" font-size="9" fill="#666">do A4</text>

  <!-- Legend -->
  <rect x="60" y="490" width="700" height="55" rx="8" fill="#fff" stroke="#ccc"/>
  <line x1="80" y1="510" x2="110" y2="510" stroke="#d35400" stroke-width="5"/>
  <text x="118" y="514" font-size="10">droga krajowa 94</text>
  <line x1="250" y1="510" x2="280" y2="510" stroke="#e67e22" stroke-width="4" stroke-dasharray="8 4"/>
  <text x="288" y="514" font-size="10">obwodnice (2007, 2014)</text>
  <line x1="450" y1="510" x2="480" y2="510" stroke="#555" stroke-width="4"/>
  <text x="488" y="514" font-size="10">kolej (stacja poza centrum)</text>
  <rect x="620" y="502" width="14" height="14" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="640" y="514" font-size="10">komunikacja autobusowa</text>
</svg>
